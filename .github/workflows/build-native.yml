name: Build Native Rust Accelerator (spana-native)

on:
  push:
    branches: [main]
    paths:
      - "packages/spana-native/**"
      - ".github/workflows/build-native.yml"
  pull_request:
    paths:
      - "packages/spana-native/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: spana-native-darwin-arm64
            file: libspana_native.dylib
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: spana-native-darwin-x64
            file: libspana_native.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: spana-native-linux-x64
            file: libspana_native.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: spana-native-linux-arm64
            file: libspana_native.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: spana-native-win32-x64
            file: spana_native.dll

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/spana-native

      - name: Build release cdylib
        working-directory: packages/spana-native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload native binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/spana-native/target/${{ matrix.target }}/release/${{ matrix.file }}
          if-no-files-found: error
