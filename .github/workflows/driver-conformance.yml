name: Driver conformance

# Runs the spana driver conformance suite against both the direct drivers
# and a locally-started Appium server. Any behavioral divergence between the
# two paths fails the job — this is the safety net for the cloud path
# (BrowserStack et al.) that uses the Appium driver underneath.
#
# See:
#   - packages/spana/flows/conformance/README.md
#   - docs/internals/appium-endpoints.md
#   - docs/internals/appium-local-dev.md

on:
  pull_request:
    paths:
      - "packages/spana/src/drivers/**"
      - "packages/spana/src/runtime/appium**"
      - "packages/spana/flows/conformance/**"
      - "packages/spana/conformance.config.ts"
      - ".github/workflows/driver-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driver-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android — direct (UiAutomator2) + Appium
    runs-on: ubuntu-latest
    # Hardware-accel KVM is available on larger runners; default runner is OK
    # for emulators but each boot is slow. Keep this job generous on timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install workspace deps
        run: bun install

      - name: Build spana package
        run: bun run --cwd packages/spana build

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools ndk;27.1.12297006

      - name: Install Appium + UiAutomator2 driver
        run: |
          npm install -g appium@2
          appium driver install uiautomator2@4.2.9

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build framework-app release APK
        run: |
          cd apps/native
          bun install
          bun run expo prebuild --platform android --no-install || true
          cd android && ./gradlew :app:assembleRelease --no-daemon

      - name: Run conformance — direct UiAutomator2
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: packages/spana
          script: >-
            adb shell settings put global hidden_api_policy 1 &&
            trap 'adb shell settings delete global hidden_api_policy' EXIT &&
            bun ./dist/cli.js test
            --driver local
            --platform android
            --config ./conformance.config.ts ||
            { status=$?; adb logcat -d -s ActivityTaskManager AndroidRuntime ReactNativeJS; exit "$status"; }

      - name: Run conformance — Appium (local server, auto-start)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: packages/spana
          script: >-
            bun ./dist/cli.js test
            --driver appium
            --appium-auto-start
            --platform android
            --config ./conformance.config.ts

      - name: Upload conformance artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-conformance-artifacts
          path: |
            packages/spana/spana-conformance-output/
            packages/spana/spana-output/
          retention-days: 7

  ios:
    name: iOS — direct (WDA) + Appium
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install workspace deps
        run: bun install

      - name: Build spana package
        run: bun run --cwd packages/spana build

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Install Appium + XCUITest driver
        run: |
          npm install -g appium@2
          appium driver install xcuitest@9.10.5

      - name: Boot iOS simulator
        run: |
          UDID=$(xcrun simctl create "spana-conformance" com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimRuntime.iOS-26-2)
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "SPANA_IOS_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build framework-app for simulator
        run: |
          cd apps/native
          bun install
          bun run expo prebuild --platform ios --no-install
          cd ios
          pod install
          xcodebuild \
            -workspace spana.xcworkspace \
            -scheme spana \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SPANA_IOS_UDID}" \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install app on simulator
        run: |
          APP_PATH="$GITHUB_WORKSPACE/apps/native/ios/build/Build/Products/Release-iphonesimulator/spana.app"
          xcrun simctl install "$SPANA_IOS_UDID" "$APP_PATH"
          echo "SPANA_IOS_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")" >> "$GITHUB_ENV"

      - name: Run conformance — direct WDA
        env:
          SPANA_WDA_LAUNCH_TIMEOUT_SECONDS: "240"
          SPANA_OUTPUT_DIR: spana-conformance-output/direct-wda
        run: |
          cd packages/spana
          bun ./dist/cli.js test \
            --driver local \
            --platform ios \
            --device "$SPANA_IOS_UDID" \
            --config ./conformance.config.ts
          if ! grep -Eq '^<testsuites name="spana" tests="[1-9][0-9]*"' "$SPANA_OUTPUT_DIR/junit-report.xml"; then
            echo "::error::Direct WDA conformance did not produce any test results"
            exit 1
          fi

      - name: Run conformance — Appium (local server, auto-start)
        run: |
          cd packages/spana
          CAPS=$(jq -nc --arg udid "$SPANA_IOS_UDID" --arg bundleId "$SPANA_IOS_BUNDLE_ID" \
            '{
              "appium:udid": $udid,
              "appium:bundleId": $bundleId,
              "appium:isHeadless": true,
              "appium:wdaLaunchTimeout": 240000,
              "appium:showXcodeLog": true
            }')
          bun ./dist/cli.js test \
            --driver appium \
            --appium-auto-start \
            --platform ios \
            --caps-json "$CAPS" \
            --config ./conformance.config.ts

      - name: Upload conformance artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-conformance-artifacts
          path: |
            packages/spana/spana-conformance-output/
            packages/spana/spana-output/
          retention-days: 7
