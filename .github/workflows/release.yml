name: Release npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_bridge:
        description: "Also publish spana-bridge"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify lint, types & tests
        run: |
          bun run lint
          CI=1 bun run check-types
          bun run test

      - name: Build Studio, spana-test & spana-bridge
        run: |
          (cd apps/studio && bun run build)
          (cd packages/spana && bun run build)
          (cd packages/spana-bridge && bun run build)

      - name: Publish spana-test
        working-directory: packages/spana
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish spana-bridge (optional)
        if: ${{ inputs.publish_bridge == true }}
        working-directory: packages/spana-bridge
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
