name: Release npm package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_bridge:
        description: "Also publish spana-bridge"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-native:
    name: Build Rust native (${{ matrix.platform_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform_arch: darwin-arm64
            file: libspana_native.dylib
          - os: macos-15
            target: x86_64-apple-darwin
            platform_arch: darwin-x64
            file: libspana_native.dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_arch: linux-x64
            file: libspana_native.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_arch: linux-arm64
            file: libspana_native.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_arch: win32-x64
            file: spana_native.dll
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: packages/spana-native

      - name: Compile spana-native
        working-directory: packages/spana-native
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage native binary
        shell: bash
        run: |
          mkdir -p staged-native/${{ matrix.platform_arch }}
          cp packages/spana-native/target/${{ matrix.target }}/release/${{ matrix.file }} staged-native/${{ matrix.platform_arch }}/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spana-native-${{ matrix.platform_arch }}
          path: staged-native/${{ matrix.platform_arch }}/${{ matrix.file }}

  publish:
    needs: build-native
    permissions:
      contents: read
      id-token: write # npm provenance; only the publish job needs it
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Download prebuilt Rust native binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spana-native-*
          path: packages/spana/native
          merge-multiple: false

      - name: Normalize native binary directories
        run: |
          for dir in packages/spana/native/spana-native-*; do
            [ -d "$dir" ] || continue
            target_name="${dir##*spana-native-}"
            mv "$dir" "packages/spana/native/$target_name"
          done
          ls -la packages/spana/native/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium for CI test suite
        run: ./packages/spana/node_modules/.bin/playwright-core install chromium

      - name: Allow Chromium sandbox (Ubuntu 24.04 AppArmor userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Verify lint, types & tests
        run: |
          bun run lint
          CI=1 bun run check-types
          bun run test

      - name: Build Studio, spana-test & spana-bridge
        run: |
          (cd apps/studio && bun run build)
          (cd packages/spana && bun run build)
          (cd packages/spana-bridge && bun run build)

      - name: Publish spana-test
        working-directory: packages/spana
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish spana-bridge (optional)
        if: ${{ inputs.publish_bridge == true }}
        working-directory: packages/spana-bridge
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
