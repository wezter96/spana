<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" role="img" aria-label="Spana v0.7 vs Playwright vs WebdriverIO benchmark chart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spanaBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cdpBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="hotBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pwBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="wdioBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Card frame -->
  <rect x="0" y="0" width="920" height="660" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="658" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="38" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="19.5" font-weight="700">Live 20-Flow × 14-Step Chromium Suite (280 Real Interactions)</text>
  <text x="32" y="60" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">Lower is better (wall-clock ms) · Apple M4 Pro · Bun 1.4.5 · Headless Chrome · benchmarks/framework-comparison/results.json</text>

  <!-- Legend -->
  <g transform="translate(530, 24)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#cbd5e1">
    <rect x="0" y="0" width="10" height="10" rx="2.5" fill="url(#cdpBar)"/>
    <text x="14" y="9">Spana CDP</text>
    <rect x="84" y="0" width="10" height="10" rx="2.5" fill="url(#hotBar)"/>
    <text x="98" y="9">Spana Hot-Cache/Pool</text>
    <rect x="224" y="0" width="10" height="10" rx="2.5" fill="url(#pwBar)"/>
    <text x="238" y="9">Playwright</text>
    <rect x="304" y="0" width="10" height="10" rx="2.5" fill="url(#wdioBar)"/>
    <text x="318" y="9">WDIO</text>
  </g>

  <!-- Vertical gridlines (bar area x=305..805 => 500px for 20000ms => 25px per 1000ms) -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="3,4">
    <line x1="305" y1="80" x2="305" y2="532"/>
    <line x1="430" y1="80" x2="430" y2="532"/>
    <line x1="555" y1="80" x2="555" y2="532"/>
    <line x1="680" y1="80" x2="680" y2="532"/>
    <line x1="805" y1="80" x2="805" y2="532"/>
  </g>
  <g fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" text-anchor="middle">
    <text x="305" y="548">0s</text>
    <text x="430" y="548">5s</text>
    <text x="555" y="548">10s</text>
    <text x="680" y="548">15s</text>
    <text x="805" y="548">20s</text>
  </g>

  <!-- Row 1: WDIO UI Login (19449ms => 486px) -->
  <g transform="translate(0, 90)">
    <text x="293" y="17" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" text-anchor="end">WebdriverIO (W3C HTTP, UI login)</text>
    <rect x="305" y="2" width="486" height="22" rx="6" fill="url(#wdioBar)"/>
    <text x="801" y="17" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600">19,449 ms</text>
  </g>

  <!-- Row 2: Playwright 1w (17710ms => 443px) -->
  <g transform="translate(0, 130)">
    <text x="293" y="17" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" text-anchor="end">Playwright (storageState, 1w)</text>
    <rect x="305" y="2" width="443" height="22" rx="6" fill="url(#pwBar)"/>
    <text x="758" y="17" fill="#c7d2fe" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600">17,710 ms</text>
  </g>

  <!-- Row 3: WDIO inject (15926ms => 398px) -->
  <g transform="translate(0, 170)">
    <text x="293" y="17" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" text-anchor="end">WebdriverIO (W3C HTTP, state inject)</text>
    <rect x="305" y="2" width="398" height="22" rx="6" fill="url(#wdioBar)"/>
    <text x="713" y="17" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600">15,926 ms</text>
  </g>

  <!-- Row 4: Playwright 4w (15574ms => 389px) -->
  <g transform="translate(0, 210)">
    <text x="293" y="17" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" text-anchor="end">Playwright (4 parallel workers)</text>
    <rect x="305" y="2" width="389" height="22" rx="6" fill="url(#pwBar)"/>
    <text x="704" y="17" fill="#c7d2fe" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600">15,574 ms</text>
  </g>

  <!-- Row 5: Spana Direct CDP fresh 1w (11339ms => 283px) -->
  <g transform="translate(0, 250)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana Direct CDP (1w, fresh ctx)</text>
    <rect x="305" y="2" width="283" height="22" rx="6" fill="url(#cdpBar)"/>
    <text x="598" y="17" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">11,339 ms</text>
    <rect x="678" y="3" width="132" height="20" rx="10" fill="#082f49" stroke="#0ea5e9" stroke-width="1"/>
    <text x="744" y="16.5" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">1.6× vs PW 1w</text>
  </g>

  <!-- Row 6: Spana Direct CDP + Video Playback 4w (9725ms => 243px) -->
  <g transform="translate(0, 290)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana CDP + Video Playback (4w)</text>
    <rect x="305" y="2" width="243" height="22" rx="6" fill="url(#cdpBar)"/>
    <text x="558" y="17" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">9,725 ms</text>
    <rect x="632" y="3" width="166" height="20" rx="10" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
    <text x="715" y="16.5" fill="#67e8f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">1.6× vs PW 4w w/ recording</text>
  </g>

  <!-- Row 7: Spana Direct CDP fresh 4w (9341ms => 234px) -->
  <g transform="translate(0, 330)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana Direct CDP Pool (4w, fresh ctx)</text>
    <rect x="305" y="2" width="234" height="22" rx="6" fill="url(#cdpBar)"/>
    <text x="549" y="17" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">9,341 ms</text>
    <rect x="623" y="3" width="144" height="20" rx="10" fill="#082f49" stroke="#0ea5e9" stroke-width="1"/>
    <text x="695" y="16.5" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">1.7× vs PW 4w (strict)</text>
  </g>

  <!-- Row 8: Spana Direct CDP hot-cache 1w (6011ms => 150px) -->
  <g transform="translate(0, 370)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana CDP hot-cache (1w, clean reset)</text>
