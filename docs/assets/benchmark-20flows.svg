    <text x="465" y="17" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">6,011 ms</text>
    <rect x="539" y="3" width="158" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="618" y="16.5" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">3.0× vs PW 1w · 3.2× WDIO</text>
  </g>

  <!-- Row 9: Spana Direct CDP hot-cache 4w (4057ms => 101px) -->
  <g transform="translate(0, 410)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana CDP hot-cache (4w, clean reset)</text>
    <rect x="305" y="2" width="101" height="22" rx="6" fill="url(#hotBar)"/>
    <text x="416" y="17" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">4,057 ms</text>
    <rect x="490" y="3" width="158" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="569" y="16.5" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">3.8× vs PW 4w · 4.8× WDIO</text>
  </g>

  <!-- Row 10: Spana + Bridge 1w (3100ms => 78px) -->
  <g transform="translate(0, 450)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana + spana-bridge (1w)</text>
    <rect x="305" y="2" width="78" height="22" rx="6" fill="url(#spanaBar)"/>
    <text x="393" y="17" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">3,100 ms</text>
    <rect x="467" y="3" width="158" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="546" y="16.5" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">5.7× vs PW 1w · 6.3× WDIO</text>
  </g>

  <!-- Row 11: Spana Shared Pool 4w (2690ms => 67px) -->
  <g transform="translate(0, 490)">
    <text x="293" y="17" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="end">Spana Shared Pool (4w, 20 flows)</text>
    <rect x="305" y="2" width="67" height="22" rx="6" fill="url(#spanaBar)"/>
    <text x="382" y="17" fill="#6ee7b7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="700">2,690 ms</text>
    <rect x="456" y="3" width="158" height="20" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
    <text x="535" y="16.5" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">5.8× vs PW 4w · 7.2× WDIO</text>
  </g>

  <!-- Bottom KPI highlight strip -->
  <g transform="translate(32, 570)">
    <rect x="0" y="0" width="272" height="66" rx="10" fill="#111c33" stroke="#1e293b"/>
    <text x="16" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">24-FLOW PILOT (HOT-CACHE, 1W/4W)</text>
    <text x="16" y="50" fill="#22d3ee" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">3.4× faster</text>
    <text x="256" y="50" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" text-anchor="end">11.88s → 3.53s (97ms)</text>

    <rect x="292" y="0" width="272" height="66" rx="10" fill="#111c33" stroke="#1e293b"/>
    <text x="308" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">RUST NATIVE VISUAL DIFF (1080P PNG)</text>
    <text x="308" y="50" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">19.2× faster</text>
    <text x="548" y="50" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" text-anchor="end">215ms → 11.2ms</text>

    <rect x="584" y="0" width="272" height="66" rx="10" fill="#111c33" stroke="#1e293b"/>
    <text x="600" y="24" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10" font-weight="600">VERIFIED REPLAY CACHE (--strict-cache)</text>
    <text x="600" y="50" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" font-weight="700">293.5× faster</text>
    <text x="840" y="50" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" text-anchor="end">7,924ms → 27ms</text>
