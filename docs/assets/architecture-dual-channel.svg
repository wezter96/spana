<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Spana Dual-Channel Web-First Architecture Diagram">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="domLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="nativeLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="420" rx="16" fill="url(#archBg)"/>
  <rect x="1" y="1" width="918" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="32" y="38" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="700">Spana Dual-Channel Web-First Architecture</text>
  <text x="32" y="58" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12">One { testID } + systemUI() API across 5 targets — ~1 ms DOM lookup paired with real native touch &amp; zero Appium</text>

  <!-- Column 1: Authoring & Agents -->
  <g transform="translate(28, 86)">
    <rect x="0" y="0" width="176" height="298" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">1. AUTHOR &amp; AGENTS</text>

    <rect x="14" y="42" width="148" height="58" rx="8" fill="#0b1324" stroke="#334155"/>
    <text x="26" y="64" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">.flow.ts</text>
    <text x="26" y="83" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">TypeScript + Lazy Fixtures</text>

    <rect x="14" y="114" width="148" height="58" rx="8" fill="#0b1324" stroke="#334155"/>
    <text x="26" y="136" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">.feature (BDD)</text>
    <text x="26" y="155" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">Gherkin compiled to flows</text>

    <rect x="14" y="186" width="148" height="94" rx="8" fill="#082f49" stroke="#06b6d4"/>
    <text x="26" y="208" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">spana mcp</text>
    <text x="26" y="227" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">Claude Code · Codex</text>
    <text x="26" y="243" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">Cursor · Antigravity</text>
    <text x="26" y="263" fill="#6ee7b7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">→ verified .flow.ts</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="204" y1="235" x2="234" y2="235" stroke="#64748b" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- Column 2: Smart Runtime -->
  <g transform="translate(238, 86)">
    <rect x="0" y="0" width="212" height="298" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="16" y="26" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">2. SMART LAYER</text>

    <rect x="14" y="42" width="184" height="54" rx="8" fill="#0b1324" stroke="#334155"/>
    <text x="26" y="63" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700">CI Filters (--changed-since)</text>
    <text x="26" y="81" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">1-token logprob judge · path rules</text>

    <rect x="14" y="108" width="184" height="54" rx="8" fill="#0b1324" stroke="#334155"/>
    <text x="26" y="129" fill="#67e8f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700">Verified Replay Cache</text>
    <text x="26" y="147" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">.spana/cache/ · --strict-cache</text>

    <rect x="14" y="174" width="184" height="106" rx="8" fill="#0b1324" stroke="#06b6d4"/>
    <text x="26" y="196" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700">Dual-Channel Coordinator</text>
    <text x="26" y="215" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">• MutationObserver reactive waits</text>
    <text x="26" y="232" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">• failFastWhenIdle + auto-scroll</text>
    <text x="26" y="249" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">• WebView frame + DPR mapping</text>
    <text x="26" y="266" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10">• Longest-first --parallel scheduler</text>
  </g>

  <!-- Split arrows 2 -> 3 (DOM & Native) -->
  <path d="M 450 185 C 470 185, 468 152, 488 152" fill="none" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <path d="M 450 285 C 470 285, 468 308, 488 308" fill="none" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrowAmber)"/>

  <!-- Column 3: Dual Channels -->
  <g transform="translate(492, 86)">
    <!-- Fast DOM Lane -->
    <rect x="0" y="0" width="204" height="142" rx="12" fill="#082f49" fill-opacity="0.45" stroke="url(#domLane)" stroke-width="1.6"/>
    <text x="14" y="24" fill="#67e8f9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700">DOM FAST LANE (~1 ms)</text>
    <text x="14" y="45" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">{ testID } · Shadow DOM · iframe</text>
    <text x="14" y="68" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• PlaywrightDomChannel (zero-setup)</text>
    <text x="14" y="86" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• spana-bridge WS (state inject)</text>
    <text x="14" y="104" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• Android CDP / Lightpanda CDP</text>
    <text x="14" y="122" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• iOS WebKit / Apple webinspectord</text>

    <!-- Native Touch Lane -->
    <rect x="0" y="156" width="204" height="142" rx="12" fill="#2e1065" fill-opacity="0.32" stroke="url(#nativeLane)" stroke-width="1.6"/>
    <text x="14" y="180" fill="#fcd34d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700">NATIVE &amp; SYSTEM UI LANE</text>
    <text x="14" y="201" fill="#e2e8f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">systemUI() · real OS touch</text>
    <text x="14" y="224" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• Direct WebDriverAgent (iOS)</text>
    <text x="14" y="242" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• Direct UiAutomator2 (Android)</text>
    <text x="14" y="260" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• Warm daemons + session reuse</text>
    <text x="14" y="278" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">• BrowserStack / Sauce Labs cloud</text>
  </g>

  <!-- Arrows 3 -> 4 -->
  <line x1="696" y1="156" x2="722" y2="156" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="696" y1="312" x2="722" y2="312" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Column 4: 5 Targets -->
  <g transform="translate(726, 86)">
    <rect x="0" y="0" width="166" height="298" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="14" y="26" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">3. FIVE TARGETS</text>

    <rect x="12" y="40" width="142" height="42" rx="8" fill="#0b1324" stroke="#06b6d4"/>
    <text x="24" y="58" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">Web</text>
    <text x="24" y="73" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.2">Playwright · CDP · Lightpanda</text>

    <rect x="12" y="92" width="142" height="42" rx="8" fill="#0b1324" stroke="#10b981"/>
    <text x="24" y="110" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">Android</text>
    <text x="24" y="125" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5">Capacitor · WebView · RN</text>

    <rect x="12" y="144" width="142" height="42" rx="8" fill="#0b1324" stroke="#38bdf8"/>
    <text x="24" y="162" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">iOS</text>
    <text x="24" y="177" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5">Capacitor · WKWebView · RN</text>

    <rect x="12" y="196" width="142" height="42" rx="8" fill="#0b1324" stroke="#818cf8"/>
    <text x="24" y="214" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">Electron</text>
    <text x="24" y="229" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5">Desktop CDP + spana-bridge</text>

    <rect x="12" y="248" width="142" height="42" rx="8" fill="#0b1324" stroke="#a78bfa"/>
    <text x="24" y="266" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700">Electrobun</text>
    <text x="24" y="281" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="9.5">CEF / WKWebView / WebView2</text>
  </g>
</svg>
