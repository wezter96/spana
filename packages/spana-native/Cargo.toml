[package]
name = "spana-native"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust SIMD visual-diff & fast XML hierarchy tokenizer for Spana"

[lib]
name = "spana_native"
crate-type = ["cdylib"]

[dependencies]
png = "0.17"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
