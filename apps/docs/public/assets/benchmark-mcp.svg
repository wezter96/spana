<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" role="img" aria-label="Spana MCP tool latency and agent benchmark chart">
  <defs>
    <linearGradient id="bgMcp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="afterBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="beforeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="430" rx="16" fill="url(#bgMcp)"/>
  <rect x="1" y="1" width="918" height="428" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="700">Spana MCP Server — Sub-5ms Agent Tool Latency</text>
  <text x="32" y="62" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12.5">PlaywrightDomChannel + MutationObserver reactive waits · Avg observation: ~273 tokens · 15-call lifecycle: 245.8 ms</text>

  <!-- Legend -->
  <g transform="translate(650, 26)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#cbd5e1">
    <rect x="0" y="0" width="10" height="10" rx="2.5" fill="url(#afterBar)"/>
    <text x="15" y="9">Current (optimized)</text>
    <rect x="135" y="0" width="10" height="10" rx="2.5" fill="url(#beforeBar)"/>
    <text x="150" y="9">Before</text>
  </g>

  <!-- Left panel: Tool latency bars (scale: 60ms => 290px) -->
  <g transform="translate(0, 88)">
    <!-- Diagnostics: 0.82ms -->
    <text x="235" y="16" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_diagnostics</text>
    <rect x="248" y="4" width="6" height="16" rx="4" fill="url(#afterBar)"/>
    <text x="262" y="16" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">0.82 ms</text>

    <!-- Assert visible: 0.97ms -->
    <g transform="translate(0, 34)">
      <text x="235" y="16" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_assert_visible</text>
      <rect x="248" y="4" width="7" height="16" rx="4" fill="url(#afterBar)"/>
      <text x="263" y="16" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">0.97 ms</text>
    </g>

    <!-- Input text: 1.39ms -->
    <g transform="translate(0, 68)">
      <text x="235" y="16" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_input_text</text>
      <rect x="248" y="4" width="9" height="16" rx="4" fill="url(#afterBar)"/>
      <text x="265" y="16" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">1.39 ms</text>
    </g>

    <!-- Observe: 1.44ms -->
    <g transform="translate(0, 102)">
      <text x="235" y="16" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_observe (billing)</text>
      <rect x="248" y="4" width="10" height="16" rx="4" fill="url(#afterBar)"/>
      <text x="266" y="16" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">1.44 ms</text>
      <text x="330" y="16" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">(~352 tokens)</text>
    </g>

    <!-- Tap confirm-upgrade: before 50.98ms (246px) vs after 2.81ms (14px) -->
    <g transform="translate(0, 144)">
      <text x="235" y="14" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_tap (confirm)</text>
      <rect x="248" y="0" width="246" height="10" rx="4" fill="url(#beforeBar)"/>
      <text x="502" y="9" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">50.98 ms</text>
      <rect x="248" y="13" width="14" height="12" rx="4" fill="url(#afterBar)"/>
      <text x="270" y="23" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">2.81 ms  (18.1× faster)</text>
    </g>

    <!-- Tap upgrade-pro: before 48.65ms (235px) vs after 3.39ms (17px) -->
    <g transform="translate(0, 188)">
      <text x="235" y="14" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_tap (upgrade)</text>
      <rect x="248" y="0" width="235" height="10" rx="4" fill="url(#beforeBar)"/>
      <text x="491" y="9" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">48.65 ms</text>
      <rect x="248" y="13" width="17" height="12" rx="4" fill="url(#afterBar)"/>
      <text x="273" y="23" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">3.39 ms  (14.4× faster)</text>
    </g>

    <!-- Tap sign-in: before 56.98ms (275px) vs after 9.57ms (46px) -->
    <g transform="translate(0, 232)">
      <text x="235" y="14" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" text-anchor="end">spana_tap (sign-in)</text>
      <rect x="248" y="0" width="275" height="10" rx="4" fill="url(#beforeBar)"/>
      <text x="531" y="9" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5">56.98 ms</text>
      <rect x="248" y="13" width="46" height="12" rx="4" fill="url(#afterBar)"/>
      <text x="302" y="23" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">9.57 ms  (6.0× faster)</text>
    </g>
  </g>

  <!-- Right panel: Live End-to-End Agent Summary Card -->
  <g transform="translate(612, 92)">
    <rect x="0" y="0" width="276" height="296" rx="12" fill="#111c33" stroke="#1e293b"/>
    <text x="18" y="28" fill="#22d3ee" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">LIVE AGENT BENCHMARK</text>
    <text x="18" y="49" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="700">6-Step SaaS Upgrade Flow</text>
    <text x="18" y="67" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5">Model: qwen3.8-27b (RTX 5090)</text>

    <line x1="18" y1="82" x2="258" y2="82" stroke="#1e293b"/>

    <text x="18" y="108" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">Completion</text>
    <text x="258" y="108" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" text-anchor="end">6 / 6 optimal turns</text>

    <text x="18" y="138" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">End-to-end wall time</text>
    <text x="258" y="138" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" text-anchor="end">3,072 ms</text>

    <text x="18" y="168" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">Spana MCP share</text>
    <text x="258" y="168" fill="#67e8f9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" text-anchor="end">422 ms (13.7%)</text>

    <text x="18" y="198" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">Total tokens used</text>
    <text x="258" y="198" fill="#f8fafc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" text-anchor="end">2,756 tokens</text>

    <line x1="18" y1="216" x2="258" y2="216" stroke="#1e293b"/>

    <text x="18" y="238" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11">Exported .flow.ts replay</text>
    <text x="18" y="264" fill="#34d399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">0 LLM calls · 6 ms</text>
    <text x="18" y="282" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="10.5">Bench any model: benchmarks/mcp-agent-bench</text>
  </g>
</svg>
