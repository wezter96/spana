<!doctype html>
<!-- Source for public/assets/spana-social-card.png. Screenshot at 1280x640:
     serve apps/docs (python3 -m http.server) and capture /scripts/og-image.html. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: -apple-system, "Inter", "Segoe UI", sans-serif;
        color: #e2e8f0;
        background:
          radial-gradient(70% 90% at 85% 10%, rgba(6, 182, 212, 0.22), transparent 70%), #070b14;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 56px 0 64px;
      }
      img {
        width: 500px;
        height: 500px;
        border-radius: 28px;
        border: 2px solid rgba(34, 211, 238, 0.35);
        flex: none;
      }
      .brand {
        font-size: 34px;
        font-weight: 800;
        color: #67e8f9;
        letter-spacing: -0.01em;
      }
      h1 {
        font-size: 92px;
        line-height: 0.98;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: #fff;
        margin: 18px 0 26px;
      }
      p {
        font-size: 30px;
        line-height: 1.3;
        color: #cbd5e1;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 30px;
      }
      .chips span {
        font-size: 20px;
        font-weight: 600;
        padding: 7px 13px;
        border-radius: 999px;
        border: 2px solid #155e75;
        color: #a5f3fc;
      }
    </style>
  </head>
  <body>
    <img src="../public/assets/spana-scout.jpg" alt="" />
    <div>
      <div class="brand">spana</div>
      <h1>One test.<br />Every screen.</h1>
      <p>TypeScript E2E testing. No Appium.<br />Agent-ready via MCP.</p>
      <div class="chips">
        <span>Web</span><span>iOS</span><span>Android</span><span>Electron</span
        ><span>Electrobun</span>
      </div>
    </div>
  </body>
</html>
